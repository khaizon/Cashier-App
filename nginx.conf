server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets are immutable; index.html and the service worker
    # must always be revalidated.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Legacy path from when the app was served under /Cashier-App/.
    location /Cashier-App/ {
        rewrite ^/Cashier-App/(.*)$ /$1 permanent;
    }
    location = /Cashier-App {
        return 301 /;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
